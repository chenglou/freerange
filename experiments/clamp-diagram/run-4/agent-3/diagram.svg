<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="svg-title svg-desc" data-text-layout-source="trusted-example-boxes">
  <title id="svg-title">Geometric reduction of a min/max expression into a clamp-shaped graph</title>
  <desc id="svg-desc">Two equal-width columns compare ordered bounds y less than or equal to u with inverted bounds y greater than u. Text is clipped to externally supplied reserved text boxes; geometry is generated from checked layout data.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#253040"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0454a"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f4f6f9; stroke: #c9d1dc; stroke-width: 1.2; }
      .plot { fill: #ffffff; stroke: #9aa8b8; stroke-width: 1.2; }
      .shade-left { fill: #eaf3ff; }
      .shade-mid { fill: #edf8ee; }
      .shade-right { fill: #fff3dd; }
      .shade-muted { fill: #f3eefb; }
      .axis { stroke: #253040; stroke-width: 1.4; marker-end: url(#arrow-dark); }
      .axis-light { stroke: #253040; stroke-width: 1.2; marker-end: url(#arrow-dark); }
      .grid { stroke: #d9e0e9; stroke-width: 1; }
      .guide { stroke: #8a94a6; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .guide-curve { stroke: #7757c8; stroke-width: 3.2; stroke-dasharray: 9 7; fill: none; }
      .clamp { stroke: #13805d; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #13805d; stroke: #ffffff; stroke-width: 2; }
      .label-box { fill: #ffffff; stroke: #bdc7d4; stroke-width: 1; }
      .formula-card { fill: #fffaf0; stroke: #d6b46c; stroke-width: 1.1; }
      .empty-box { fill: #fff5f6; stroke: #d9969a; stroke-width: 1.1; }
      .key-point-box { fill: #f2fbf6; stroke: #8ac6a4; stroke-width: 1.1; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .subtitle { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2d3a4b; }
      .chain { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #344156; }
      .col-title { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182230; }
      .note { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4a586d; }
      .axis-text { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #253040; }
      .small { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #324055; }
      .small-strong { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #243047; }
      .card-text { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #243047; }
      .key-point { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f3d32; }
      .red { fill: #9f3d43; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="780"/>
  
    <clipPath id="title-clip"><rect x="300" y="22" width="600" height="50"/></clipPath>
    <text class="title" text-anchor="middle" dominant-baseline="middle" clip-path="url(#title-clip)"><tspan x="600" y="47">Min/max reduction as a clamp graph</tspan></text>
  
    <clipPath id="formula-chain-clip"><rect x="204" y="92" width="792" height="64"/></clipPath>
    <text class="chain" text-anchor="middle" dominant-baseline="middle" clip-path="url(#formula-chain-clip)"><tspan x="600" y="108">E = x + min(-y, y + max(x, -z - y))</tspan><tspan x="600" y="124">= x - max(y, min(-x - y, z))</tspan><tspan x="600" y="140">= x - clamp(y, z, -x - y) when y &lt;= -x - y</tspan></text>

  <rect class="panel" x="40" y="160" width="544" height="508" rx="8"/>
  <rect class="panel" x="616" y="160" width="544" height="508" rx="8"/>
  
    <clipPath id="ordered-column-title-clip"><rect x="238" y="166" width="148" height="32"/></clipPath>
    <text class="col-title" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-column-title-clip)"><tspan x="312" y="182">Ordered bounds</tspan></text>
  
    <clipPath id="inverted-column-title-clip"><rect x="812" y="166" width="152" height="32"/></clipPath>
    <text class="col-title" text-anchor="middle" dominant-baseline="middle" clip-path="url(#inverted-column-title-clip)"><tspan x="888" y="182">Inverted bounds</tspan></text>
  
    <clipPath id="ordered-note-clip"><rect x="56" y="206" width="496" height="44"/></clipPath>
    <text class="note" text-anchor="start" dominant-baseline="middle" clip-path="url(#ordered-note-clip)"><tspan x="64" y="220.66666666666666">Assume y &lt;= u, equivalently x + 2y &lt;= 0.</tspan><tspan x="64" y="235.33333333333334">The lower, pass-through, and upper regimes all exist.</tspan></text>
  
    <clipPath id="inverted-note-clip"><rect x="632" y="206" width="496" height="44"/></clipPath>
    <text class="note" text-anchor="start" dominant-baseline="middle" clip-path="url(#inverted-note-clip)"><tspan x="640" y="220.66666666666666">Assume y &gt; u, equivalently x + 2y &gt; 0.</tspan><tspan x="640" y="235.33333333333334">The clamp interval reverses, so max forces C(z) = y.</tspan></text>

  <g id="ordered-plot">
    <rect class="plot" x="88" y="260" width="448" height="270"/>
    <rect class="shade-left" x="88" y="260" width="132" height="270"/>
    <rect class="shade-mid" x="220" y="260" width="184" height="270"/>
    <rect class="shade-right" x="404" y="260" width="132" height="270"/>
    <line class="grid" x1="88" y1="336" x2="536" y2="336"/>
    <line class="grid" x1="88" y1="450" x2="536" y2="450"/>
    <line class="guide" x1="220" y1="260" x2="220" y2="492"/>
    <line class="guide" x1="404" y1="260" x2="404" y2="492"/>
    <line class="axis-light" x1="88" y1="530" x2="88" y2="260"/>
    <line class="axis" x1="88" y1="492" x2="536" y2="492"/>
    
    <clipPath id="ordered-axis-c-clip"><rect x="42" y="264" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-axis-c-clip)"><tspan x="51" y="274">C</tspan></text>
    
    <clipPath id="ordered-tick-y-clip"><rect x="198" y="502" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-tick-y-clip)"><tspan x="207" y="512">y</tspan></text>
    
    <clipPath id="ordered-tick-u-clip"><rect x="382" y="502" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-tick-u-clip)"><tspan x="391" y="512">u</tspan></text>
    
    <clipPath id="ordered-tick-z-clip"><rect x="540" y="502" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-tick-z-clip)"><tspan x="549" y="512">z</tspan></text>
    <path class="clamp" d="M 88 450 L 220 450 L 404 336 L 536 336"/>
    <circle class="point" cx="220" cy="450" r="5"/>
    <circle class="point" cx="404" cy="336" r="5"/>
    <rect class="label-box" x="96" y="460" width="74" height="26" rx="5"/>
    <clipPath id="ordered-left-region-clip"><rect x="96" y="460" width="74" height="26"/></clipPath>
    <text class="small-strong" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-left-region-clip)"><tspan x="133" y="473">z &lt; y</tspan></text>
    <rect class="label-box" x="256" y="384" width="112" height="26" rx="5"/>
    <clipPath id="ordered-middle-region-clip"><rect x="256" y="384" width="112" height="26"/></clipPath>
    <text class="small-strong" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-middle-region-clip)"><tspan x="312" y="397">y &lt;= z &lt;= u</tspan></text>
    <rect class="label-box" x="412" y="286" width="74" height="26" rx="5"/>
    <clipPath id="ordered-right-region-clip"><rect x="412" y="286" width="74" height="26"/></clipPath>
    <text class="small-strong" text-anchor="middle" dominant-baseline="middle" clip-path="url(#ordered-right-region-clip)"><tspan x="449" y="299">z &gt; u</tspan></text>
  </g>

  <g id="ordered-cards">
    <rect class="formula-card" x="52" y="588" width="140" height="58" rx="7"/>
    <clipPath id="ordered-left-card-clip"><rect x="52" y="588" width="140" height="58"/></clipPath>
    <text class="card-text" text-anchor="start" dominant-baseline="middle" clip-path="url(#ordered-left-card-clip)"><tspan x="60" y="602.5">z &lt; y</tspan><tspan x="60" y="617">C = y</tspan><tspan x="60" y="631.5">E = x - y</tspan></text>
    <rect class="formula-card" x="230" y="588" width="140" height="58" rx="7"/>
    <clipPath id="ordered-middle-card-clip"><rect x="230" y="588" width="140" height="58"/></clipPath>
    <text class="card-text" text-anchor="start" dominant-baseline="middle" clip-path="url(#ordered-middle-card-clip)"><tspan x="238" y="602.5">y &lt;= z &lt;= u</tspan><tspan x="238" y="617">C = z</tspan><tspan x="238" y="631.5">E = x - z</tspan></text>
    <rect class="formula-card" x="408" y="588" width="164" height="58" rx="7"/>
    <clipPath id="ordered-right-card-clip"><rect x="408" y="588" width="164" height="58"/></clipPath>
    <text class="card-text" text-anchor="start" dominant-baseline="middle" clip-path="url(#ordered-right-card-clip)"><tspan x="416" y="599.6">z &gt; u</tspan><tspan x="416" y="611.2">C = u</tspan><tspan x="416" y="622.8">E = x - u</tspan><tspan x="416" y="634.4">= 2x + y</tspan></text>
  </g>

  <g id="inverted-plot">
    <rect class="plot" x="664" y="260" width="448" height="270"/>
    <rect class="shade-muted" x="664" y="260" width="448" height="270"/>
    <line class="grid" x1="664" y1="342" x2="1112" y2="342"/>
    <line class="grid" x1="664" y1="440" x2="1112" y2="440"/>
    <line class="guide" x1="816" y1="260" x2="816" y2="492"/>
    <line class="guide" x1="960" y1="260" x2="960" y2="492"/>
    <line class="axis-light" x1="664" y1="530" x2="664" y2="260"/>
    <line class="axis" x1="664" y1="492" x2="1112" y2="492"/>
    
    <clipPath id="inverted-axis-c-clip"><rect x="618" y="264" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#inverted-axis-c-clip)"><tspan x="627" y="274">C</tspan></text>
    
    <clipPath id="inverted-tick-u-clip"><rect x="794" y="502" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#inverted-tick-u-clip)"><tspan x="803" y="512">u</tspan></text>
    
    <clipPath id="inverted-tick-y-clip"><rect x="938" y="502" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#inverted-tick-y-clip)"><tspan x="947" y="512">y</tspan></text>
    
    <clipPath id="inverted-tick-z-clip"><rect x="1116" y="502" width="18" height="20"/></clipPath>
    <text class="axis-text" text-anchor="middle" dominant-baseline="middle" clip-path="url(#inverted-tick-z-clip)"><tspan x="1125" y="512">z</tspan></text>
    <path class="guide-curve" d="M 664 492 L 816 440 L 1112 440"/>
    <path class="clamp" d="M 664 342 L 1112 342"/>
    <line x1="960" y1="310" x2="816" y2="310" stroke="#b0454a" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
    <rect class="empty-box" x="768" y="278" width="242" height="44" rx="7"/>
    <clipPath id="inverted-empty-clip"><rect x="768" y="278" width="242" height="44"/></clipPath>
    <text class="small" text-anchor="start" dominant-baseline="middle" clip-path="url(#inverted-empty-clip)"><tspan x="776" y="292.6666666666667">empty interval:</tspan><tspan x="776" y="307.3333333333333">no z satisfies y &lt;= z &lt;= u</tspan></text>
    <rect class="label-box" x="814" y="334" width="263" height="38" rx="7"/>
    <clipPath id="inverted-final-clip"><rect x="814" y="334" width="263" height="38"/></clipPath>
    <text class="small-strong" text-anchor="start" dominant-baseline="middle" clip-path="url(#inverted-final-clip)"><tspan x="822" y="346.6666666666667">C(z) = y, so</tspan><tspan x="822" y="359.3333333333333">E = x - y for all z</tspan></text>
    <rect class="label-box" x="680" y="456" width="196" height="42" rx="7"/>
    <clipPath id="inverted-guide-clip"><rect x="680" y="456" width="196" height="42"/></clipPath>
    <text class="small" text-anchor="start" dominant-baseline="middle" clip-path="url(#inverted-guide-clip)"><tspan x="688" y="470">dashed guide:</tspan><tspan x="688" y="484">min(z, u) stays below y</tspan></text>
  </g>

  <g id="inverted-card">
    <rect class="formula-card" x="738" y="588" width="300" height="58" rx="7"/>
    <clipPath id="inverted-card-main-clip"><rect x="738" y="588" width="300" height="58"/></clipPath>
    <text class="card-text" text-anchor="start" dominant-baseline="middle" clip-path="url(#inverted-card-main-clip)"><tspan x="746" y="602.5">u &lt; y makes the middle band empty</tspan><tspan x="746" y="617">C(z) = max(y, min(z, u)) = y</tspan><tspan x="746" y="631.5">E = x - y</tspan></text>
  </g>
  <rect class="key-point-box" x="40" y="686" width="1120" height="60" rx="8"/>
    <clipPath id="key-point-clip"><rect x="40" y="686" width="1120" height="60"/></clipPath>
    <text class="key-point" text-anchor="start" dominant-baseline="middle" clip-path="url(#key-point-clip)"><tspan x="48" y="706">Key point: the final clamp notation is valid under y &lt;= -x - y.</tspan><tspan x="48" y="726">When the bounds invert, the original max/min expression collapses to the y branch instead.</tspan></text>
</svg>
