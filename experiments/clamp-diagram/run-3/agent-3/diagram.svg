<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Clamp-shaped min/max reduction geometry</title>
  <desc id="desc">Two equal-width columns compare ordered bounds y &lt;= u and inverted bounds y &gt; u for C(z) = max(y, min(z, u)), where u = -x - y and E = x - C(z).</desc>
  <defs>
    <pattern id="blue-stripe" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#eaf4ff"/>
      <path d="M0 8 L8 0" stroke="#aacbe8" stroke-width="1"/>
    </pattern>
    <pattern id="amber-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff3d7"/>
      <circle cx="2" cy="2" r="1.1" fill="#d9b65b"/>
      <circle cx="7" cy="7" r="1.1" fill="#d9b65b"/>
    </pattern>
    <pattern id="green-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#eaf8ef"/>
      <path d="M0 5 H10 M5 0 V10" stroke="#a9d8b8" stroke-width="0.8"/>
    </pattern>
    <pattern id="empty-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff0f0"/>
      <path d="M-2 8 L8 -2 M2 10 L10 2" stroke="#d88a8a" stroke-width="1.1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a5568"/>
    </marker>
  </defs>
  <style>
    svg { font-family: Helvetica, Arial, sans-serif; background: #fbfbf8; color: #172026; }
    .title { font-family: Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 760; fill: #172026; }
    .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #46525c; }
    .formula { font-family: Menlo, Consolas, monospace; font-size: 17px; fill: #1f2933; }
    .panel { fill: #ffffff; stroke: #cfd7df; stroke-width: 1.5; }
    .panel-title { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 720; fill: #172026; }
    .panel-note { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #4a5568; }
    .plot-frame { fill: none; stroke: #b9c3cc; stroke-width: 1.2; }
    .axis { stroke: #4a5568; stroke-width: 1.4; marker-end: url(#arrow); }
    .c-axis { stroke: #4a5568; stroke-width: 1.2; marker-end: url(#arrow); }
    .tick { stroke: #596775; stroke-width: 1.1; stroke-dasharray: 4 4; }
    .tick-label { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #2b3640; }
    .region-label { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #27313a; }
    .region-sub { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #4a5568; }
    .graph { fill: none; stroke: #0e7490; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .guide { fill: none; stroke: #8b5e34; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; }
    .final { fill: none; stroke: #b42318; stroke-width: 5; stroke-linecap: round; }
    .line-label { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 720; fill: #172026; }
    .formula-card { fill: #f7fafc; stroke: #cfd7df; stroke-width: 1; }
    .formula-head { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 760; fill: #27313a; }
    .formula-small { font-family: Menlo, Consolas, monospace; font-size: 11.4px; fill: #334150; }
    .empty-band { fill: url(#empty-hatch); stroke: #c24137; stroke-width: 1; }
    .empty-text { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 740; fill: #7a1f18; }
  </style>

  <text x="54" y="50" class="title">Min/max reduction as a clamp-shaped graph</text>
  <text x="54" y="76" class="subtitle">Let u = -x - y and C(z) = max(y, min(z, u)); then E = x - C(z).</text>
  <text x="54" y="105" class="formula">E = x + min(-y, y + max(x, -z - y))</text>
  <text x="54" y="129" class="formula">  = x - max(y, min(-x - y, z))</text>
  <text x="54" y="153" class="formula">  = x - clamp(y, z, -x - y) only when y &lt;= -x - y</text>

  <rect x="54" y="172" width="528" height="580" rx="8" class="panel"/>
  <rect x="618" y="172" width="528" height="580" rx="8" class="panel"/>

  <text x="78" y="218" class="panel-title">Ordered bounds</text>
  <text x="78" y="239" class="panel-note">y &lt;= u, equivalently x + 2y &lt;= 0</text>
  <text x="78" y="263" class="panel-note">The middle pass-through exists, so C(z) is an honest clamp.</text>

  <text x="642" y="218" class="panel-title">Inverted bounds</text>
  <text x="642" y="239" class="panel-note">y &gt; u, equivalently x + 2y &gt; 0</text>
  <text x="642" y="263" class="panel-note">The ordered clamp interval is empty; the shape degenerates.</text>

  <rect x="132" y="344" width="108" height="244" fill="url(#blue-stripe)" opacity="0.9"/>
  <rect x="240" y="344" width="170" height="244" fill="url(#amber-dots)" opacity="0.95"/>
  <rect x="410" y="344" width="120" height="244" fill="url(#green-grid)" opacity="0.95"/>
  <rect x="132" y="344" width="398" height="244" class="plot-frame"/>
  <line x1="132" y1="558" x2="530" y2="558" class="axis"/>
  <line x1="132" y1="362" x2="132" y2="558" class="c-axis"/>
  <line x1="240" y1="394" x2="240" y2="566" class="tick"/>
  <line x1="410" y1="394" x2="410" y2="566" class="tick"/>
  <path d="M 132 522 L 240 522 L 410 410 L 530 410" class="graph"/>
  <text x="144" y="354" class="tick-label" text-anchor="middle">C</text>
  <text x="546" y="563" class="tick-label" text-anchor="middle">z</text>
  <text x="240" y="585" class="tick-label" text-anchor="middle">y</text>
  <text x="410" y="585" class="tick-label" text-anchor="middle">u=-x-y</text>
  <text x="186" y="374" class="region-label" text-anchor="middle">z &lt; y</text>
  <text x="186" y="387" class="region-sub" text-anchor="middle">C = y</text>
  <text x="325" y="374" class="region-label" text-anchor="middle">y &lt;= z &lt;= u</text>
  <text x="325" y="387" class="region-sub" text-anchor="middle">C = z</text>
  <text x="470" y="374" class="region-label" text-anchor="middle">z &gt; u</text>
  <text x="470" y="387" class="region-sub" text-anchor="middle">C = u</text>

  
  <rect x="149.93" y="652" width="87.61" height="78" rx="6" class="formula-card"/>
  <text x="161.93" y="676" class="formula-head">z &lt; y</text>
  <text x="161.93" y="693.40" class="formula-small">C = y</text>
  <text x="161.93" y="711.40" class="formula-small">E = x - y</text>
  <rect x="261.55" y="652" width="105.84" height="78" rx="6" class="formula-card"/>
  <text x="273.55" y="676" class="formula-head">y &lt;= z &lt;= u</text>
  <text x="273.55" y="693.40" class="formula-small">C = z</text>
  <text x="273.55" y="711.40" class="formula-small">E = x - z</text>
  <rect x="391.39" y="652" width="94.68" height="78" rx="6" class="formula-card"/>
  <text x="403.39" y="676" class="formula-head">z &gt; u</text>
  <text x="403.39" y="693.40" class="formula-small">C = u</text>
  <text x="403.39" y="711.40" class="formula-small">E = 2x + y</text>

  <rect x="696" y="344" width="398" height="244" fill="#fffaf0"/>
  <rect x="828" y="344" width="138" height="244" class="empty-band" opacity="0.68"/>
  <rect x="696" y="344" width="398" height="244" class="plot-frame"/>
  <line x1="696" y1="558" x2="1094" y2="558" class="axis"/>
  <line x1="696" y1="362" x2="696" y2="558" class="c-axis"/>
  <line x1="828" y1="394" x2="828" y2="566" class="tick"/>
  <line x1="966" y1="394" x2="966" y2="566" class="tick"/>
  <path d="M 696 520 L 828 472 L 1094 472" class="guide"/>
  <line x1="696" y1="414" x2="1094" y2="414" class="final"/>
  <line x1="828" y1="374" x2="966" y2="374" stroke="#c24137" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="708" y="354" class="tick-label" text-anchor="middle">C</text>
  <text x="1110" y="563" class="tick-label" text-anchor="middle">z</text>
  <text x="828" y="585" class="tick-label" text-anchor="middle">u=-x-y</text>
  <text x="966" y="585" class="tick-label" text-anchor="middle">y</text>
  <text x="910.96" y="371" class="empty-text" text-anchor="middle">empty: y &lt;= z &lt;= u</text>
  <text x="914" y="398" class="line-label">C(z) = y</text>
  <text x="850" y="495" class="line-label">dashed guide: min(z,u) &lt;= y</text>

  <rect x="758.40" y="624" width="247.20" height="62" rx="6" class="formula-card"/>
  <text x="770.40" y="648" class="formula-head">u &lt; y, so max(y, min(z,u)) = y</text>
  <text x="770.40" y="667.40" class="formula-small">E = x - y for all z</text>
</svg>
