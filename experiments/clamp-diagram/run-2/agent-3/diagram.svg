<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Clamp-shaped min/max reduction diagram</title>
  <desc id="desc">A geometric SVG showing ordered and inverted threshold cases for reducing E to a clamp-shaped expression.</desc>
  <defs>
    <pattern id="diag-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2 8 L8 -2 M2 10 L10 2" stroke="#2563eb" stroke-width="1.4" opacity="0.55"/>
    </pattern>
    <pattern id="dot-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.4" fill="#166534" opacity="0.65"/>
    </pattern>
    <pattern id="vertical-stripe" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M2 0 V8 M6 0 V8" stroke="#a16207" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <pattern id="cross-hatch" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0 L9 9 M9 0 L0 9" stroke="#be123c" stroke-width="1.1" opacity="0.6"/>
    </pattern>
  </defs>
  <style>
    svg { background: #f8fafc; color: #111827; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .headline { font-size: 20px; font-weight: 750; fill: #111827; }
    .subline { font-size: 15px; fill: #374151; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panel-title { font-size: 18px; font-weight: 750; fill: #0f172a; }
    .panel-note { font-size: 13.5px; fill: #334155; }
    .plot-frame { fill: none; stroke: #64748b; stroke-width: 1.4; }
    .threshold { stroke: #111827; stroke-width: 2; stroke-dasharray: 6 5; }
    .axis { stroke: #334155; stroke-width: 1.8; marker-end: url(#axis-arrow); }
    .axis-label { font-size: 14px; font-weight: 650; fill: #111827; }
    .label-chip { fill: rgba(255, 255, 255, 0.9); stroke: rgba(15, 23, 42, 0.22); stroke-width: 1; rx: 6; }
    .label { font-size: 13px; font-weight: 700; fill: #111827; }
    .threshold-label { font-size: 13px; font-weight: 700; fill: #111827; }
    .piecewise-title { font-size: 14px; font-weight: 750; fill: #111827; }
    .piecewise { font-size: 13px; fill: #1f2937; }
    .formula { font-size: 15px; fill: #111827; }
    .swatch { stroke: #475569; stroke-width: 0.8; }
    .swatch-pattern { stroke: none; }
    .invalid-note { font-size: 12.5px; font-weight: 700; fill: #881337; }
  </style>
  <defs>
    <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>

  <g>
    <text class="headline" x="44" y="44">Geometry of the clamp-shaped reduction</text>
    <text class="formula" x="44" y="72">E = x + min(-y, y + max(x, -z - y)) = x - max(y, min(-x - y, z))</text>
    <text class="subline" x="44" y="96">It is x - clamp(y, z, -x - y) only under the ordered-bound assumption y &lt;= -x - y.</text>
  </g>

  
    <rect class="panel" x="50" y="126" width="520" height="584" rx="8"/>
    <rect x="50" y="126" width="8" height="584" fill="#2563eb"/>
    <text class="panel-title" x="231" y="168" text-anchor="middle">Ordered bounds</text>
    <text class="panel-note" x="286" y="202.5" text-anchor="middle">y &lt;= -x - y, equivalently x + 2y &lt;= 0</text>
<text class="panel-note" x="286" y="219.5" text-anchor="middle">lower threshold y comes before upper -x-y</text>
  

  <g>
    <rect x="90" y="256" width="110" height="180" fill="#dbeafe"/>
    <rect x="90" y="256" width="110" height="180" fill="url(#diag-hatch)"/>
    <rect x="200" y="256" width="200" height="180" fill="#dcfce7"/>
    <rect x="200" y="256" width="200" height="180" fill="url(#dot-grid)"/>
    <rect x="400" y="256" width="130" height="180" fill="#fef3c7"/>
    <rect x="400" y="256" width="130" height="180" fill="url(#vertical-stripe)"/>
    <rect class="plot-frame" x="90" y="256" width="440" height="180"/>
    <line class="threshold" x1="200" y1="256" x2="200" y2="436"/>
    <line class="threshold" x1="400" y1="256" x2="400" y2="436"/>
    <line class="axis" x1="90" y1="454" x2="530" y2="454"/>
    <text class="axis-label" x="522" y="478">z</text>
    <rect class="label-chip" x="110" y="302" width="74" height="70"/>
    <text class="label" x="147" y="325" text-anchor="middle">z &lt; y</text>
<text class="label" x="147" y="342" text-anchor="middle">inner = y</text>
<text class="label" x="147" y="359" text-anchor="middle">E = x - y</text>
    <rect class="label-chip" x="246" y="298" width="108" height="78"/>
    <text class="label" x="300" y="325" text-anchor="middle">y &lt;= z &lt;= -x-y</text>
<text class="label" x="300" y="342" text-anchor="middle">inner = z</text>
<text class="label" x="300" y="359" text-anchor="middle">E = x - z</text>
    <rect class="label-chip" x="414" y="298" width="98" height="78"/>
    <text class="label" x="463" y="325" text-anchor="middle">z &gt; -x-y</text>
<text class="label" x="463" y="342" text-anchor="middle">inner = -x-y</text>
<text class="label" x="463" y="359" text-anchor="middle">E = 2x + y</text>
    <text class="threshold-label" x="200" y="469" text-anchor="middle">y</text>
    <text class="threshold-label" x="404" y="469" text-anchor="middle">-x - y</text>
  </g>

  <g>
    <rect class="label-chip" x="76" y="520" width="454" height="158"/>
    <text class="piecewise-title" x="94" y="545">Ordered piecewise result</text>
    <rect class="swatch" x="96" y="562" width="18" height="18" fill="#dbeafe"/><rect class="swatch-pattern" x="96" y="562" width="18" height="18" fill="url(#diag-hatch)"/>
    <text class="piecewise" x="124" y="576">z &lt; y: inner = y, so E = x - y</text>
    <rect class="swatch" x="96" y="592" width="18" height="18" fill="#dcfce7"/><rect class="swatch-pattern" x="96" y="592" width="18" height="18" fill="url(#dot-grid)"/>
    <text class="piecewise" x="124" y="606">y &lt;= z &lt;= -x-y: inner = z, so E = x - z</text>
    <rect class="swatch" x="96" y="622" width="18" height="18" fill="#fef3c7"/><rect class="swatch-pattern" x="96" y="622" width="18" height="18" fill="url(#vertical-stripe)"/>
    <text class="piecewise" x="124" y="636">z &gt; -x-y: inner = -x-y, so E = 2x + y</text>
    <text class="piecewise" x="96" y="666">Honest clamp form here: x - clamp(y, z, -x-y).</text>
  </g>

  
    <rect class="panel" x="630" y="126" width="520" height="584" rx="8"/>
    <rect x="630" y="126" width="8" height="584" fill="#be123c"/>
    <text class="panel-title" x="821" y="168" text-anchor="middle">Inverted bounds</text>
    <text class="panel-note" x="874" y="202.5" text-anchor="middle">y &gt; -x - y, equivalently x + 2y &gt; 0</text>
<text class="panel-note" x="874" y="219.5" text-anchor="middle">upper threshold -x-y is below lower threshold y</text>
  

  <g>
    <rect x="670" y="256" width="440" height="180" fill="#e0f2fe"/>
    <rect x="790" y="256" width="220" height="180" fill="#ffe4e6"/>
    <rect x="790" y="256" width="220" height="180" fill="url(#cross-hatch)"/>
    <rect class="plot-frame" x="670" y="256" width="440" height="180"/>
    <line class="threshold" x1="790" y1="256" x2="790" y2="436"/>
    <line class="threshold" x1="1010" y1="256" x2="1010" y2="436"/>
    <line class="axis" x1="670" y1="454" x2="1110" y2="454"/>
    <text class="axis-label" x="1102" y="478">z</text>
    <rect class="label-chip" x="820" y="304" width="160" height="74"/>
    <text class="label" x="900" y="329" text-anchor="middle">for every z</text>
<text class="label" x="900" y="346" text-anchor="middle">inner = y</text>
<text class="label" x="900" y="363" text-anchor="middle">E = x - y</text>
    <text class="threshold-label" x="790" y="469" text-anchor="middle">-x - y (upper)</text>
    <text class="threshold-label" x="1027" y="469" text-anchor="middle">y (lower)</text>
    <text class="invalid-note" x="808" y="282">invalid clamp interval</text>
  </g>

  <g>
    <rect class="label-chip" x="656" y="520" width="454" height="158"/>
    <text class="piecewise-title" x="674" y="545">Degenerate clamp-shaped term</text>
    <text class="piecewise" x="676" y="576">max(y, min(z, -x-y)) = y for all z.</text>
    <text class="piecewise" x="676" y="606">Therefore E = x - y.</text>
    <text class="piecewise" x="676" y="636">This is clamp-shaped, but not a valid ordered clamp.</text>
    <text class="piecewise" x="676" y="666">The crossed band marks upper &lt; lower.</text>
  </g>
</svg>
